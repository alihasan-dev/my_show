name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder .env for asset bundling
        run: touch .env

      - name: Build web (release)
        run: |
          flutter build web --release \
            --dart-define=API_KEY=${{ secrets.API_KEY }} \
            --dart-define=OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYSHOW_A9997 }}
          channelId: live
          projectId: myshow-a9997
          entryPoint: .